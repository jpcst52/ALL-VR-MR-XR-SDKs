<!doctype html>
<meta charset="utf-8">
<title>Model contact sheet</title>
<style>body{margin:0;background:#0b1f4d}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
<script type="module">
// Developer tool: lays every shipped prop and character out on a grid with its id, so the set can be reviewed.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const manifest = await (await fetch("../shared/models.json")).json();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#1d3260");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(-3, 6, 5); scene.add(sun);
const loader = new GLTFLoader();
const ids = [...Object.keys(manifest.props), ...Object.keys(manifest.characters).map((id) => "c:" + id)];
const cols = 8, cell = 3;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const rows = Math.ceil(ids.length / cols);
camera.position.set(cols * cell / 2 - 1.5, rows * cell * 0.9, rows * cell * 1.15);
camera.lookAt(cols * cell / 2 - 1.5, 0.5, rows * cell / 2 - 2);
let i = 0;
for (const id of ids) {
  const character = id.startsWith("c:");
  const entry = character ? manifest.characters[id.slice(2)] : manifest.props[id];
  const gltf = await loader.loadAsync("../../assets/models-mp/" + entry.file);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = box.getSize(new THREE.Vector3());
  gltf.scene.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
  box.setFromObject(gltf.scene);
  gltf.scene.position.set((i % cols) * cell, -box.min.y, Math.floor(i / cols) * cell);
  scene.add(gltf.scene);
  const c = document.createElement("canvas"); c.width = 256; c.height = 48;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.font = "28px sans-serif"; g.fillText(id + " " + size.toArray().map((v) => v.toFixed(1)).join("x"), 4, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
  s.scale.set(2.6, 0.5, 1); s.position.set((i % cols) * cell, 0.1, Math.floor(i / cols) * cell + 1.3); scene.add(s);
  i++;
}
renderer.render(scene, camera);
window.__done = true;
</script>
