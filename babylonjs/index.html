<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Babylon.js — Luminous Totem</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101923; color: #edf6ff; font: 16px/1.5 system-ui, sans-serif; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #info { position: fixed; z-index: 1; top: 1rem; left: 1rem; max-width: 25rem; padding: .75rem 1rem; border-radius: .7rem; background: #101923dc; pointer-events: none; }
      h1, p { margin: 0; }
      p { color: #c3d4df; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.42.0/babylon.js"></script>
  </head>
  <body>
    <header id="info">
      <h1>Luminous Totem</h1>
      <p>Orbit the glowing totem on desktop. Use the Babylon.js VR button for an immersive view.</p>
    </header>
    <canvas id="renderCanvas"></canvas>
    <script src="./main.js"></script>
  </body>
</html>
