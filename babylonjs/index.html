<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Babylon.js — Luminous Totem</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101923; color: #edf6ff; font: 16px/1.5 system-ui, sans-serif; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #info { position: fixed; z-index: 1; top: 1rem; left: 1rem; max-width: 25rem; padding: .75rem 1rem; border-radius: .7rem; background: #101923e8; }
      h1, p { margin: 0; }
      p { color: #c3d4df; }
      button { margin-top: .75rem; border: 1px solid #75e6d3; border-radius: .45rem; padding: .45rem .7rem; background: #17313c; color: #edf6ff; font: inherit; cursor: pointer; }
      #status { min-height: 1.5em; margin-top: .35rem; font-size: .9rem; }
    </style>
    <script src="../vendor/babylon/babylon.js"></script>
  </head>
  <body>
    <header id="info">
      <h1>Luminous Totem</h1>
      <p>Orbit the glowing totem. Cycle its color or explore the three orbiting beacons.</p>
      <button id="change-hue" type="button">Change totem hue</button>
      <p id="status" role="status" aria-live="polite">Luminous Totem is ready to explore.</p>
    </header>
    <canvas id="renderCanvas"></canvas>
    <script src="./main.js"></script>
  </body>
</html>
