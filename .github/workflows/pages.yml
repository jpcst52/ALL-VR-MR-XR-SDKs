# Publishes the static WebXR site (built by scripts/build-webxr.mjs into site/) to GitHub Pages.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy WebXR site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check picture sizes (3 MB limit)
        run: node scripts/check-image-sizes.mjs
      - name: Build the site
        run: node scripts/build-webxr.mjs
      - name: Install the browser-check tools (Playwright; uses the runner's Chrome)
        run: npm ci
        working-directory: tools/vr-capture
      - name: Check the site under the sub-path
        run: node tools/pages/site-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
